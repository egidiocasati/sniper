<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper - Reset Password</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Nuova password</h2>

        <div id="alert" class="alert" style="display:none"></div>

        <form id="reset-form" class="card">
            <div class="form-group">
                <label for="password">Nuova password (min 8 caratteri)</label>
                <input type="password" id="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="password2">Conferma password</label>
                <input type="password" id="password2" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Salva</button>
        </form>
    </div>

    <script>
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
        document.getElementById('alert').textContent = 'Link non valido.';
        document.getElementById('alert').className = 'alert alert-error';
        document.getElementById('alert').style.display = 'block';
        document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        const alert = document.getElementById('alert');

        if (password !== password2) {
            alert.textContent = 'Le password non coincidono';
            alert.className = 'alert alert-error';
            alert.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            });
            const data = await res.json();
            if (res.ok) {
                alert.textContent = 'Password aggiornata! Ora puoi accedere.';
                alert.className = 'alert alert-success';
                alert.style.display = 'block';
                document.getElementById('reset-form').style.display = 'none';
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            } else {
                alert.textContent = data.error;
                alert.className = 'alert alert-error';
                alert.style.display = 'block';
            }
        } catch (err) {
            alert.textContent = 'Errore di connessione';
            alert.className = 'alert alert-error';
            alert.style.display = 'block';
        }
    });
    </script>
</body>
</html>
